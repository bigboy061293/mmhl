# Mimohl radio plan. Shell syntax; read by mimohl-gen-configs and mimohl-map-ports.
# Copy to /etc/mimohl/mimohl.conf on the Pi and edit there.

# Regulatory domain. Must match on both ends. US = 902-928 MHz.
COUNTRY=US

# Role of THIS box: "ap" runs hostapd_s1g on every radio, "sta" runs
# wpa_supplicant_s1g on every radio. The far end uses the other role.
ROLE=ap

# Interface name prefix. Radios become ${IF_PREFIX}0..3, pinned to USB ports.
# Default "hl" (hl0..hl3) stays out of the kernel's own wlanN names, so a
# rename can never collide with the Pi's onboard Wi-Fi or a dongle that
# enumerated first. Set to "wlan" only if onboard Wi-Fi is disabled
# (dtoverlay=disable-wifi, which install-on-pi.sh adds) and you accept the
# small risk of a rename race at boot.
IF_PREFIX=hl

# One SSID per radio so each far-end radio binds to its partner on the
# same channel: ${SSID_BASE}-0 .. ${SSID_BASE}-3.
SSID_BASE=mimohl
# WPA3-SAE passphrase. CHANGE THIS.
PASSPHRASE=change-me-please

# Per-radio channel plan: "<bandwidth MHz> <S1G channel>".
# US channel centres: 1 MHz ch N = 902.0 + N/2 MHz (odd N),
# 2/4/8 MHz channels are the even numbers listed in docs/research.md.
# Default plan spreads the four radios across the band with no overlap:
#   radio 0:  8 MHz ch 44 -> 920-928 MHz (centre 924)
#   radio 1:  4 MHz ch 24 -> 912-916 MHz (centre 914)
#   radio 2:  2 MHz ch 10 -> 906-908 MHz (centre 907)
#   radio 3:  1 MHz ch 1  -> 902-903 MHz (centre 902.5)
RADIO0="8 44"
RADIO1="4 24"
RADIO2="2 10"
RADIO3="1 1"
