# Morse Micro driver options (one set of options applies to ALL dongles).
# country is rewritten from /etc/mimohl/mimohl.conf by install-on-pi.sh.
options morse country=US

# Do NOT set these here for a multi-dongle box:
#   macaddr_suffix / macaddr_octet  -> every dongle without an OTP MAC would get the same MAC
#   bcf=<file>                      -> forces one board config onto all dongles; only safe if
#                                      all four are the same module AND their OTP has no board id
#   serial=<id>                     -> same override for every dongle
