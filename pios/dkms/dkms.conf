PACKAGE_NAME="morse"
PACKAGE_VERSION="@VERSION@"

# Build flags for the Mimohl setup:
#   CONFIG_MORSE_USB=y            the dongles are USB
#   CONFIG_MORSE_VENDOR_COMMAND=y morse_cli and hostapd_s1g talk to the driver over nl80211 vendor commands
#   CONFIG_MORSE_USER_ACCESS      deliberately NOT set: its /dev/morse_io node and "morse" class are
#                                 created once per probe with fixed names, so the 2nd dongle fails to
#                                 probe (see docs/research.md, "multi-instance")
#   DEBUG=n                       release build (-O2)
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build KERNEL_SRC=${kernel_source_dir} CONFIG_WLAN_VENDOR_MORSE=m CONFIG_MORSE_USB=y CONFIG_MORSE_VENDOR_COMMAND=y CONFIG_MORSE_COUNTRY=US DEBUG=n modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

BUILT_MODULE_NAME[0]="morse"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
